version: "3.9"

services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: postgres16
    restart: always
    environment:
      POSTGRES_USER: mywalletuser
      POSTGRES_PASSWORD: mywalletuser
      POSTGRES_DB: walletaccount
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
