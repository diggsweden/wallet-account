version: "3.9"

services:
  # Local dev database; Postgres needs a writable filesystem (data, socket and tmp dirs).
  db: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
    image: postgres:16
    container_name: postgres16
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: mywalletuser
      POSTGRES_PASSWORD: mywalletuser
      POSTGRES_DB: walletaccount
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
